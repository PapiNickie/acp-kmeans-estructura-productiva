[theme]
base = "light"
primaryColor = "#C4502E"
backgroundColor = "#FBF8F3"
secondaryBackgroundColor = "#F1EBE1"
textColor = "#1F2A30"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap"
baseRadius = "0.5rem"
showSidebarBorder = true
chartCategoricalColors = ["#C4502E", "#2F6DB5", "#1A9E77", "#D99A1E", "#7E57C2", "#A8652B", "#C9578A", "#5A7D1E"]

[theme.sidebar]
backgroundColor = "#F1EBE1"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
